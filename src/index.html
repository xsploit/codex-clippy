<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Clippy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="assistant" aria-live="polite">
      <section id="bubble" class="bubble interactive">
        <div class="bubble-grain" aria-hidden="true"></div>
        <header>
          <div class="identity">
            <span id="status-dot" class="status-dot starting"></span>
            <div>
              <strong>CLIPPY</strong>
              <span id="status-label">Starting Codex…</span>
            </div>
          </div>
          <div id="mode-switch" class="mode-switch" role="group" aria-label="Clippy mode">
            <button type="button" data-mode="chatgpt" title="Regular ChatGPT conversation">CHAT</button>
            <button type="button" data-mode="codex" title="Codex tools and computer work">CODEX</button>
          </div>
          <div class="window-actions">
            <button id="chat-history" type="button" title="Chats" aria-label="Open chat history" aria-expanded="false">☰</button>
            <button id="settings" type="button" title="Settings" aria-label="Open Clippy settings" aria-expanded="false">⚙</button>
            <button id="new-chat" type="button" title="New chat" aria-label="New chat">↻</button>
            <button id="collapse" type="button" title="Collapse" aria-label="Collapse">—</button>
            <button id="hide" type="button" title="Hide to tray" aria-label="Hide to tray">×</button>
          </div>
        </header>

        <section id="chat-menu" class="chat-menu interactive" aria-label="Clippy chats" hidden>
          <div class="chat-menu-heading">
            <div>
              <strong>CLIPPY CHATS</strong>
              <span id="chat-menu-source">Saved ChatGPT conversations</span>
            </div>
            <button id="close-chat-menu" type="button" title="Close chats" aria-label="Close chat history">×</button>
          </div>
          <div id="chat-list" class="chat-list" role="list">
            <p class="chat-list-empty">Loading chats…</p>
          </div>
          <button id="chat-menu-new" class="chat-menu-new" type="button">＋ New chat</button>
        </section>

        <section id="settings-menu" class="settings-menu interactive" aria-label="Clippy settings" hidden>
          <div class="settings-menu-heading">
            <div>
              <strong>CLIPPY SETTINGS</strong>
              <span>Saved instantly</span>
            </div>
            <button id="close-settings" type="button" title="Close settings" aria-label="Close settings">×</button>
          </div>
          <div class="settings-scroll">
            <fieldset>
              <legend>WINDOW</legend>
              <label class="setting-row">
                <span><strong>Always on top</strong><small>Keep Clippy above your other windows</small></span>
                <input id="setting-always-on-top" type="checkbox" />
              </label>
              <label class="setting-row">
                <span><strong>Show on launch</strong><small>Otherwise Clippy starts quietly in the tray</small></span>
                <input id="setting-show-on-launch" type="checkbox" />
              </label>
              <label class="setting-row">
                <span><strong>Open speech bubble</strong><small>Start expanded instead of character-only</small></span>
                <input id="setting-bubble-open" type="checkbox" />
              </label>
              <label class="setting-row">
                <span><strong>Animate Clippy</strong><small>Play reactions while Clippy works</small></span>
                <input id="setting-animations" type="checkbox" />
              </label>
            </fieldset>

            <fieldset>
              <legend>STARTUP</legend>
              <label class="setting-row">
                <span><strong>Start with Windows</strong><small id="login-setting-detail">Launch Clippy after signing in</small></span>
                <input id="setting-open-at-login" type="checkbox" />
              </label>
              <label class="setting-row select-row">
                <span><strong>Starting mode</strong><small>Choose Chat, Codex, or your last mode</small></span>
                <select id="setting-startup-mode" aria-label="Starting mode">
                  <option value="last">Last used</option>
                  <option value="chatgpt">Chat</option>
                  <option value="codex">Codex</option>
                </select>
              </label>
            </fieldset>

            <fieldset>
              <legend>CHATGPT</legend>
              <label class="setting-row">
                <span><strong>Show ChatGPT.com chats</strong><small>Merge signed-in web history into Clippy Chats</small></span>
                <input id="setting-sync-web-history" type="checkbox" />
              </label>
              <label class="setting-row select-row">
                <span><strong>Web history limit</strong><small>Maximum recent web chats shown</small></span>
                <select id="setting-web-history-limit" aria-label="Web history limit">
                  <option value="10">10 chats</option>
                  <option value="25">25 chats</option>
                  <option value="50">50 chats</option>
                </select>
              </label>
            </fieldset>
          </div>
          <div class="settings-footer">
            <span id="settings-version">Codex Clippy</span>
            <span id="settings-saved" role="status">Ready</span>
          </div>
        </section>

        <div id="transcript" class="transcript" role="log">
          <div class="assistant-message"><p>Bahha bro. It looks like you’re trying to boss around a repository. Want help?</p></div>
        </div>

        <div id="request-panel" class="request-panel" hidden></div>

        <form id="composer">
          <textarea id="prompt" rows="2" placeholder="Tell Clippy what to do…" aria-label="Message Codex Clippy"></textarea>
          <div id="attachment-list" class="attachment-list" aria-label="Attached files" hidden></div>
          <div class="composer-options">
            <button id="attach" class="attach-button" type="button" title="Attach files or images" aria-label="Attach files">＋</button>
            <label class="composer-select model-select-wrap" title="Model">
              <span>MODEL</span>
              <select id="model-select" aria-label="Model"><option>Loading…</option></select>
            </label>
            <label id="effort-wrap" class="composer-select" title="Reasoning effort" hidden>
              <span>THINK</span>
              <select id="effort-select" aria-label="Reasoning effort"></select>
            </label>
            <label id="permission-wrap" class="composer-select permission-select-wrap" title="Codex file and computer access" hidden>
              <span>ACCESS</span>
              <select id="permission-select" aria-label="Codex permissions"></select>
            </label>
          </div>
          <div class="composer-footer">
            <span>Paste images · Ctrl + Enter</span>
            <div>
              <button id="mic" class="mic-button secondary" type="button" title="Dictate with local Whisper" aria-label="Start dictation" aria-pressed="false">🎙 Speak</button>
              <button id="stop" class="secondary" type="button" hidden>Stop</button>
              <button id="send" class="primary" type="submit">Do it</button>
            </div>
          </div>
        </form>
        <span class="bubble-tail" aria-hidden="true"></span>
      </section>

      <button id="open-bubble" class="open-bubble interactive" type="button" hidden>Need help?</button>
    </main>
    <script src="../node_modules/markdown-it/dist/markdown-it.min.js"></script>
    <script src="markdown-renderer.js"></script>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
